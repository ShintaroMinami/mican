name: Action Sample

on:
  push:
    branches:
      - master
      - working
  release:
    types: [released]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out code from repository
        uses: actions/checkout@v5

      - name: Setting up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tqdm setuptools setuptools_scm wheel

      - name: Install pymican
        run: pip install .
      
      - name: Test
        run: |
          python tests/test_malisam.py
          python tests/test_mmcif.py
